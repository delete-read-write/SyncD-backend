repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: unsupported
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: unsupported
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false

      - id: forbid-env-files
        name: forbid .env files
        entry: .env files must not be committed, use .env.example
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$
