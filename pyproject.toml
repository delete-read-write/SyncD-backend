[project]
name = "syncd-backend"
version = "0.1.0"
description = "SyncD backend service"
authors = [
    { name = "D.R.W", email = "delete.read.write@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "syncd"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "ASYNC",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "INP001",
    "RUF",
]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
